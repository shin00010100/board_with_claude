# 운영용 Nginx 설정
# 실행: nginx -p <project-root> -c nginx/prod.conf (경로는 프로젝트 루트 기준 상대경로)

worker_processes 1;
pid logs/nginx.pid;

events {
    worker_connections 1024;
}

http {
    types {
        text/html                             html;
        text/css                              css;
        application/javascript                js mjs;
        application/json                      json;
        image/svg+xml                         svg;
        image/png                             png;
        image/jpeg                            jpg jpeg;
        image/x-icon                          ico;
        font/woff2                            woff2;
    }
    default_type application/octet-stream;

    access_log logs/access.log;
    error_log  logs/error.log;

    server {
        listen 8080;
        server_name localhost;

        root Frontend/dist;
        index index.html;

        location /api/ {
            proxy_pass http://127.0.0.1:8000;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # SPA 폴백: React Router가 클라이언트 사이드에서 라우팅을 처리하도록 index.html로 위임
        location / {
            try_files $uri /index.html;
        }
    }

    # 443/TLS: 인증서가 준비되면 아래 서버 블록을 활성화한다 (골격 단계에서는 인증서 없음)
    # server {
    #     listen 443 ssl;
    #     server_name localhost;
    #     ssl_certificate     /path/to/fullchain.pem;
    #     ssl_certificate_key /path/to/privkey.pem;
    #     root Frontend/dist;
    #     index index.html;
    #     location /api/ {
    #         proxy_pass http://127.0.0.1:8000;
    #     }
    #     location / {
    #         try_files $uri /index.html;
    #     }
    # }
}
