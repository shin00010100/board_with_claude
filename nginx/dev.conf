# 개발용 Nginx 설정
# 실행: nginx -p <project-root> -c nginx/dev.conf (경로는 프로젝트 루트 기준 상대경로)
# 브라우저는 항상 이 Nginx(8080)에만 접속한다. vite(5173)/uvicorn(8000)에는 직접 접속하지 않는다.

worker_processes 1;
pid logs/nginx.pid;

events {
    worker_connections 1024;
}

http {
    # 시스템 nginx 설치본의 mime.types에 의존하지 않도록 최소한의 타입만 직접 정의한다.
    types {
        text/html                             html;
        text/css                              css;
        application/javascript                js mjs;
        application/json                      json;
        image/svg+xml                         svg;
        image/png                             png;
        image/jpeg                            jpg jpeg;
        image/x-icon                          ico;
        font/woff2                            woff2;
    }
    default_type application/octet-stream;

    access_log logs/access.log;
    error_log  logs/error.log;

    server {
        listen 8080;
        server_name localhost;

        # 백엔드 API: FastAPI가 /api 프리픽스로 마운트되어 있으므로 경로를 그대로 전달한다 (재작성 없음)
        location /api/ {
            proxy_pass http://127.0.0.1:8000;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # 프론트엔드: vite 개발 서버로 프록시 (/dist 사용 안 함)
        # Upgrade/Connection 헤더는 vite HMR 웹소켓이 이 프록시를 통해 터널링되도록 하기 위함
        location / {
            proxy_pass http://127.0.0.1:5173;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
        }
    }
}
